<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Museo del Emprendimiento 3D</title>
<style>
:root{--bg:#14110f;--glass:rgba(24,21,19,.88);--ink:#f4efe8;--mut:#b9afa3;--acc:#f2b84b;--ok:#3ddc97;--bad:#ff6b6b;--line:rgba(255,255,255,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#14110f;--glass:rgba(255,252,246,.94);--ink:#1d1a17;--mut:#5f574e;--acc:#b86e00;--line:rgba(0,0,0,.12)}}
:root[data-theme="light"]{--glass:rgba(255,252,246,.94);--ink:#1d1a17;--mut:#5f574e;--acc:#b86e00;--line:rgba(0,0,0,.12)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#w{display:block;width:100%;height:100%;touch-action:none}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 10px 40px rgba(0,0,0,.45)}
#hud{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:14px}
#hud h1{font-size:15px;margin:0;letter-spacing:.3px;white-space:nowrap}
#hud h1 span{color:var(--acc)}
.prog{flex:1;height:8px;border-radius:9px;background:var(--line);overflow:hidden;min-width:60px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--ok));transition:width .3s}
#cnt{font-size:13px;color:var(--mut);white-space:nowrap}
button{font:inherit;cursor:pointer}
.btn{background:var(--acc);color:#1b1305;border:0;border-radius:10px;padding:8px 14px;font-weight:700;font-size:13px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
#help{position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding:8px 12px;border-radius:10px;font-size:12px;color:var(--mut)}
#panel{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:min(410px,calc(100% - 28px));max-height:64vh;overflow:auto;border-radius:18px;transform:translateY(135%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
#panel.on{transform:none}
#A{display:block;width:100%;aspect-ratio:16/9;border-radius:18px 18px 0 0}
.tx{padding:14px 18px 18px}
.tx small{color:var(--acc);font-weight:700;letter-spacing:.8px;text-transform:uppercase;font-size:11px}
.tx h2{margin:5px 0 8px;font-size:20px;line-height:1.25}
.tx p{margin:0;font-size:14.5px;line-height:1.6;color:var(--ink)}
.tx .btn{margin-top:12px}
#qm{position:fixed;inset:0;background:rgba(8,6,5,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#qm.on{display:flex}
#qb{width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:20px;padding:22px}
#qb h2{font-size:21px;margin:10px 0 14px;line-height:1.3}
#qb small{color:var(--mut)}
.bar{height:6px;background:var(--line);border-radius:6px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.opt{display:block;width:100%;text-align:left;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;font-size:15px;transition:.15s}
.opt:hover{border-color:var(--acc);transform:translateX(3px)}
.opt.ok{background:rgba(61,220,151,.18);border-color:var(--ok)}
.opt.bad{background:rgba(255,107,107,.18);border-color:var(--bad)}
.opt.dim{opacity:.45;pointer-events:none}
#fb p{font-size:14.5px;line-height:1.55;margin:12px 0 4px}
.big{font-size:54px!important;font-weight:800;color:var(--acc);margin:6px 0!important}
#qb .btn{margin:10px 8px 0 0}

#mm{position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 56px);border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.3)}
#joy{display:none;position:fixed;left:calc(env(safe-area-inset-left,0px) + 26px);bottom:calc(env(safe-area-inset-bottom,0px) + 30px);width:128px;height:128px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.4);touch-action:none;z-index:5}
#knob{position:absolute;left:32px;top:32px;width:60px;height:60px;border-radius:50%;background:rgba(242,184,75,.9);box-shadow:0 4px 14px rgba(0,0,0,.5);pointer-events:none}
@media (pointer:coarse){#joy{display:block}#help{display:none}#mm{left:auto;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}#panel{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 72px);left:14px;right:14px;width:auto;max-width:440px;margin:0 auto;max-height:46vh;transform:translateY(-150%)}#panel.on{transform:none}}
#w{cursor:grab}
</style></head><body>

function txtTex(txt,w,h,fs,bg,fg,border){const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");if(bg){x.fillStyle=bg;x.fillRect(0,0,w,h);}
if(border){x.strokeStyle=border;x.lineWidth=4;x.strokeRect(2,2,w-4,h-4);}x.fillStyle=fg;let f=fs;x.font=`700 ${f}px system-ui,sans-serif`;while(x.measureText(txt).width>w-40&&f>14){f--;x.font=`700 ${f}px system-ui,sans-serif`;}

const keys={};let yaw=0,pitch=0,walking=false,drag=false,lx=0,ly=0,cur=-2;const seen=new Set(),P={x:23.5,z:19};
addEventListener("keydown",e=>{const k=e.key.toLowerCase();keys[k]=1;if(k.startsWith("arrow"))e.preventDefault();});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=0);
let lid=null;cv.addEventListener("pointerdown",e=>{if(lid!==null)return;lid=e.pointerId;drag=true;lx=e.clientX;ly=e.clientY;});
addEventListener("pointermove",e=>{if(!drag||e.pointerId!==lid)return;yaw-=(e.clientX-lx)*.005;pitch=Math.max(-1,Math.min(1,pitch-(e.clientY-ly)*.005));lx=e.clientX;ly=e.clientY;});
addEventListener("pointerup",e=>{if(e.pointerId===lid){drag=false;lid=null;}});addEventListener("pointercancel",e=>{if(e.pointerId===lid){drag=false;lid=null;}});
const joy=document.getElementById("joy"),kn=document.getElementById("knob");let jx=0,jy=0,jid=null;
function jmove(e){const b=joy.getBoundingClientRect();let dx=e.clientX-(b.left+b.width/2),dy=e.clientY-(b.top+b.height/2);const m=Math.hypot(dx,dy),mx=46;if(m>mx){dx=dx/m*mx;dy=dy/m*mx;}jx=dx/mx;jy=dy/mx;kn.style.transform=`translate(${dx}px,${dy}px)`;}
joy.addEventListener("pointerdown",e=>{jid=e.pointerId;joy.setPointerCapture(e.pointerId);jmove(e);e.stopPropagation();});
joy.addEventListener("pointermove",e=>{if(e.pointerId===jid)jmove(e);});
const jend=e=>{if(e.pointerId===jid){jid=null;jx=jy=0;kn.style.transform="";}};
joy.addEventListener("pointerup",jend);joy.addEventListener("pointercancel",jend);

S.forEach((s,i)=>{g.fillStyle=cur==i?"#fff":seen.has(i)?"#3ddc97":"#f2b84b";g.fillRect(s.wx*sk-2,s.wy*sk-2,4,4);});
g.save();g.translate(P.x*40*sk,P.z*40*sk);g.rotate(-yaw);g.fillStyle="#fff";g.beginPath();g.moveTo(0,-6);g.lineTo(4,4);g.lineTo(-4,4);g.closePath();g.fill();g.restore();}
function show(i){if(i===cur)return;cur=i;if(i<0){panel.classList.remove("on");return;}const s=S[i];art(A,s);rm.textContent=s.r;tt.textContent=s.t;dd.textContent=s.d;go.style.display=s.quiz?"inline-block":"none";panel.classList.add("on");
if(!s.quiz){seen.add(i);cnt.textContent=seen.size+"/"+NOBRA+" obras";pg.style.width=seen.size/NOBRA*100+"%";}}
const clk=new THREE.Clock();
function tick(){const dt=Math.min(clk.getDelta(),.05),qo=qm.classList.contains("on");
let f=(keys.w||keys.arrowup||walking?1:0)-(keys.s||keys.arrowdown?1:0)-jy,sd=(keys.d?1:0)-(keys.a?1:0)+jx,tr=(keys.arrowleft?1:0)-(keys.arrowright?1:0);
if(qo)f=sd=tr=0;yaw+=tr*1.9*dt;
const sy=Math.sin(yaw),cy=Math.cos(yaw);let vx=-sy*f+cy*sd,vz=-cy*f-sy*sd;const m=Math.hypot(vx,vz);
if(m){const k=Math.min(1,m)/m*4.5*dt;vx*=k;vz*=k;if(can(P.x+vx,P.z))P.x+=vx;if(can(P.x,P.z+vz))P.z+=vz;}
cam.position.set(P.x,1.7,P.z);cam.rotation.set(pitch,yaw,0);
let best=-1,bd=4.3;S.forEach((s,i)=>{const d=Math.hypot(M(s.wx)-P.x,M(s.wy)-P.z);if(d<bd){bd=d;best=i;}});show(best);
S.forEach((s,i)=>s.fm.emissive.setHex(i===cur?0x7a5400:seen.has(i)?0x0d4d2b:0));
rd.render(scn,cam);mmDraw();requestAnimationFrame(tick);}
tick();
